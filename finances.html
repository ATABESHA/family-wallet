<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>My Finances</title>
<style>
:root{
  --bg:#f2f2f7;--card:rgba(255,255,255,.82);--card-solid:#fff;--text:#1c1c1e;--muted:#6e6e73;
  --line:rgba(60,60,67,.12);--track:rgba(120,120,128,.16);--accent:#0a84ff;--danger:#ff3b30;--ok:#30b158;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--input:rgba(118,118,128,.12);
  --hero1:#0a84ff;--hero2:#5e5ce6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000;--card:rgba(28,28,30,.86);--card-solid:#1c1c1e;--text:#f2f2f7;--muted:#98989f;
  --line:rgba(84,84,88,.45);--track:rgba(120,120,128,.28);--shadow:none;--input:rgba(118,118,128,.24);
  --hero1:#0a60d0;--hero2:#4b3fc4;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Georgian",sans-serif;
  min-height:100vh;padding:calc(env(safe-area-inset-top) + 30px) 0 calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:flex-end;gap:8px;padding:14px 0 10px}
header.top .tt{flex:1;min-width:0}
header.top h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{color:var(--muted);font-size:14px;margin-bottom:2px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--input);display:grid;place-items:center;font-size:18px;flex:none}
.flag{width:24px;height:16px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 .5px rgba(0,0,0,.25);display:block}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:22px;padding:20px;margin:6px 0 12px;box-shadow:0 10px 30px rgba(10,132,255,.25)}
.hero .lbl{opacity:.85;font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:10px}
.hero .pill{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:9px 11px}
.hero .pill b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.hero .pill span{font-size:12px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;word-break:break-word}
.donutwrap{display:flex;align-items:center;gap:14px}
.donut{width:140px;height:140px;flex:none}
.dc1{font-weight:700;fill:var(--text)}
.dc2{fill:var(--muted)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hleg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.hleg span{display:flex;align-items:center;gap:5px}
.hleg i{width:10px;height:10px;border-radius:3px}
svg.chart{width:100%;height:auto;display:block}
.ax{font-size:9.5px;fill:var(--muted)}
.ax.cur{fill:var(--text);font-weight:700}
.vl{font-size:8.5px;fill:var(--muted)}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list .it:first-child{border-top:0;padding-top:2px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .meta{color:var(--muted);font-size:13px}
.it .rt{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.it .rt small{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.sect{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 6px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:14px;
  background:var(--card-solid);box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);animation:pin .45s ease both;transition:transform .15s}
.prow:active{transform:scale(.985)}
.prow>span{position:relative;z-index:1}
.prow .pfill{position:absolute;z-index:0;left:0;top:0;bottom:0;width:var(--p);background:linear-gradient(90deg,var(--c1),var(--c2));
  border-right:2px solid var(--ce);overflow:hidden;animation:pgrow 1.1s cubic-bezier(.2,.8,.2,1) both}
.prow .pfill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-100%);animation:shine 3.6s ease-in-out 1.3s infinite}
.pic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none}
.prow .mid{flex:1;min-width:0}
.prow .nm{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .meta{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .rt{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.prow .rt em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
.prow .rt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
@keyframes pgrow{from{width:0}}
@keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 8px}
.tl::-webkit-scrollbar{display:none}
.tl svg{display:block}
.tlinfo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 4px}
.tlinfo b{font-size:17px}
.tlinfo span{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.tlr{display:flex;align-items:center;gap:8px;width:100%;padding:8px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}
.tlr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlr .d{color:var(--muted);font-size:12px;flex:none}
.tlr .v{font-variant-numeric:tabular-nums;flex:none;min-width:76px;text-align:right}
@media (prefers-color-scheme: dark){.prow{box-shadow:none}.prow .pfill::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%)}}
@media (prefers-reduced-motion: reduce){.prow,.prow .pfill,.prow .pfill::after{animation:none}}
.empty{text-align:center;padding:36px 16px}
.empty .e1{font-size:46px}
.empty p{color:var(--muted)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;text-align:center;margin-top:10px}
.btn.sec{background:var(--input);color:var(--accent)}
.btn.danger{background:var(--input);color:var(--danger)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line)}
.tabbar .wrap{display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px;min-width:62px;max-width:80px;white-space:nowrap}
.tab .ti{line-height:0}
.tab.on{color:var(--accent)}
.fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(10,132,255,.4);margin-top:-22px}
/* detail */
.dhead{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.back{color:var(--accent);font-size:17px;padding:6px 0}
.dtitle{text-align:center;margin:6px 0 4px}
.dtitle h1{margin:8px 0 4px;font-size:26px;letter-spacing:-.4px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;margin:2px}
.chip.m{background:var(--input);color:var(--muted)}
.ringwrap{display:flex;justify-content:center;margin:6px 0}
.ring{width:190px;height:190px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--input);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b{font-variant-numeric:tabular-nums;word-break:break-word}
.kv.red b{color:var(--danger)}
.sched .s{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.sched .s:first-of-type{border-top:0}
.sched .s.paid{color:var(--muted)}
.sched .s.nx{color:var(--accent);font-weight:600}
.amt{font-size:12.5px;font-variant-numeric:tabular-nums}
.amt .r{display:grid;grid-template-columns:1.05fr 1fr .95fr 1fr 1.1fr;gap:4px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.amt .r span{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt .r span:first-child{text-align:left}
.amt .h{color:var(--muted);font-weight:600;border-top:0}
.amt .paid{color:var(--muted)}
.amt .nx{color:var(--accent);font-weight:600}
.link{color:var(--accent);font-size:15px;padding:8px 0 0}
.note{color:var(--muted);font-size:13px;white-space:pre-wrap}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .bar0{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;z-index:2;border-bottom:1px solid var(--line)}
.sheet .bar0 b{font-size:17px}
.sheet .bar0 button{color:var(--accent);font-size:17px;min-width:60px;text-align:left}
.sheet .bar0 .done{font-weight:600;text-align:right}
.fg{background:var(--card-solid);border-radius:14px;margin:14px 0;overflow:hidden}
.fg.tight{margin-top:6px}
.fr{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:48px;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr label{flex:none;width:132px;font-size:16px}
.fr input,.fr select,.fr textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--text);text-align:right;padding:12px 0;outline:none;-webkit-appearance:none;appearance:none}
.fr select{text-align-last:right}
.fr input[readonly],.fr input.calc{color:var(--accent);font-weight:600}
.fr textarea{text-align:left;min-height:70px;resize:vertical}
.fr.col{flex-direction:column;align-items:stretch;padding:10px 14px}
.fr.col label{width:auto;color:var(--muted);font-size:13px}
.fr .unit{color:var(--muted);flex:none}
.plus{flex:none;width:30px;height:30px;border-radius:50%;background:var(--input);color:var(--accent);font-size:20px;line-height:1;display:grid;place-items:center}
.hint{color:var(--muted);font-size:13px;margin:-6px 6px 10px}
.seg{display:flex;background:var(--input);border-radius:10px;padding:2px;margin:10px 0 4px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card-solid);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.preview{background:var(--input);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0;line-height:1.5}
.lbl2{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:18px 6px 0}
.langs .lg{display:flex;align-items:center;gap:12px;padding:14px;width:100%;border-top:1px solid var(--line);font-size:17px}
.langs .lg:first-child{border-top:0}
.langs .lg .flag{width:36px;height:24px;border-radius:4px}
.langs .lg .ck{margin-left:auto;color:var(--accent);font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow span{flex:1}
.mrow button{color:var(--danger);font-size:14px}
.tog{display:inline-block;margin-left:2px;padding:1px 8px;border-radius:10px;background:var(--input);color:var(--accent);font-weight:600}
.subl{margin:-14px 10px 0 22px;padding:12px 12px 4px;background:var(--card-solid);border-radius:0 0 14px 14px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.sl{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sl:first-child{border-top:0}
.sl .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .v{font-variant-numeric:tabular-nums;flex:none}
.sl.done .n,.sl.done .v{text-decoration:line-through;color:var(--muted)}
.pth{width:30px;height:30px;border-radius:8px;background:var(--input);display:grid;place-items:center;overflow:hidden;flex:none;font-size:14px}
.pth img{width:100%;height:100%;object-fit:cover;background:#fff;display:block}
.prt{border-top:1px solid var(--line)}
.prt:first-child{border-top:0}
.prt>.fr{border-top:0;gap:8px}
.prt .pm .fr{border-top:1px solid var(--line)}
.ppr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ppr:first-of-type{border-top:0}
.ppr .n{flex:1;min-width:0}
.ppr .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppr .n a,.ppr .n small{font-size:12px;color:var(--accent);text-decoration:none}
.ppr .n small{color:var(--muted)}
.ppr .v{font-variant-numeric:tabular-nums;flex:none;font-weight:600}
.ppr.done .n b,.ppr.done .v{text-decoration:line-through;color:var(--muted)}
.ppr .pb{flex:none;padding:6px 12px;border-radius:14px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.ppr .pb.u{background:var(--input);color:var(--muted)}
.wimg{width:52px;height:52px;border-radius:11px;overflow:hidden;flex:none;display:grid;place-items:center;font-size:24px}
.wimg img{width:100%;height:100%;object-fit:cover;background:#fff;display:block}
.pd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:20px;background:var(--input);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--accent);color:#fff}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.imgs button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;border:2px solid var(--line);padding:0}
.imgs button.on{border:3px solid var(--accent)}
.imgs img{width:100%;height:100%;object-fit:contain;display:block}
.imgs .up{display:grid;place-items:center;background:var(--input);color:var(--accent);font-size:12px;text-align:center;padding:4px;border-style:dashed}
.wphoto{width:100%;max-height:300px;object-fit:contain;background:#fff;border-radius:18px;display:block;margin:12px 0}
.hero.sav{background:linear-gradient(135deg,#1fa463,#0e7f6e);box-shadow:0 10px 30px rgba(31,164,99,.25)}
.combo{border-top:1px solid var(--line);padding:11px 0}
.combo:first-of-type{border-top:0;padding-top:2px}
.combo .cl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.combo .cl span{display:flex;align-items:center;gap:6px;background:var(--input);border-radius:20px;padding:3px 10px 3px 3px;font-size:13px;max-width:100%}
.combo .cl img,.combo .cl i{width:24px;height:24px;border-radius:50%;object-fit:cover;font-style:normal;display:grid;place-items:center;background:#fff;font-size:13px;flex:none}
.combo .ct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.combo .ct b{color:var(--text);font-variant-numeric:tabular-nums}
.logr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.logr:first-of-type{border-top:0}
.logr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logr .d{color:var(--muted);font-size:12px;flex:none}
.logr .v{font-variant-numeric:tabular-nums;flex:none;min-width:80px;text-align:right}
.logr .v.pos{color:var(--ok)}
.logr button{color:var(--muted);font-size:15px;padding:0 2px;flex:none}
.spl{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px);-webkit-clip-path:inset(0px 0px 0px 0px round 0px);clip-path:inset(0px 0px 0px 0px round 0px);
  transition:clip-path .5s cubic-bezier(.65,0,.25,1),-webkit-clip-path .5s cubic-bezier(.65,0,.25,1),opacity .35s ease;overflow:auto}
.spl .sp-ic{width:104px;height:104px;border-radius:26px;background:rgba(255,255,255,.15);display:flex;align-items:flex-end;justify-content:center;gap:9px;padding-bottom:22px;flex:none;
  box-shadow:0 10px 30px rgba(0,0,0,.15);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.spl .sp-ic i{width:16px;border-radius:5px;background:#fff;transform-origin:bottom;transform:scaleY(0);animation:barUp .55s cubic-bezier(.3,1.6,.5,1) .1s forwards}
.spl .sp-g{font-size:24px;font-weight:700;letter-spacing:-.3px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.spl .sp-ring{position:relative;width:180px;height:180px;flex:none;opacity:0;transform:scale(.88);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1)}
.spl .sp-ring circle.pg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1) .1s}
.spl .sp-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spl .sp-num b{font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.spl .sp-num span{font-size:13px;opacity:.85}
.spl .sp-sub{font-size:14px;opacity:0;transition:opacity .45s .2s}
.spl.s2 .sp-g,.spl.s2 .sp-ring,.spl.s2 .sp-ob{opacity:1;transform:none}
.spl.s2 .sp-sub{opacity:.85}
.spl.s2 .sp-ic{transform:scale(.62)}
.spl.out>*{opacity:0!important;transition:opacity .2s}
.spl .sp-ob{width:min(340px,100%);display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.spl .sp-s{text-align:center;opacity:.9;font-size:15px;margin:-6px 0 6px}
.spl .sp-flags{display:flex;gap:8px}
.spl .sp-flags button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;border:2px solid transparent}
.spl .sp-flags button.on{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.7)}
.spl .sp-flags .flag{width:36px;height:24px}
.spl input,.spl select{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.16);outline:none;-webkit-appearance:none;appearance:none}
.spl input::placeholder{color:rgba(255,255,255,.7)}
.spl select option{color:#000}
.spl .sp-go{margin-top:6px;padding:15px;border-radius:14px;background:#fff;color:#2f5bea;font-weight:700;font-size:17px}
@keyframes barUp{to{transform:scaleY(1)}}
#view.fadein{animation:vfade .3s ease}
@keyframes vfade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
</style>

function insPerMonth(p){const a=num(p.insAmount);if(!isLoanLike(p)||!a)return 0;
  if(p.insFreq==='each')return p.freq==='once'?0:a*ppy(p)/12;if(p.insFreq==='annual')return a/12;return 0}
function perMonth(p){let a=currentPay(p);if(p.freq==='once')return 0;
  return (p.freq==='weekly'?a*52/12:a/stepM(p))+insPerMonth(p)}

/* TAE / effective annual rate, incl. opening fee & insurance (IRR by bisection) */
function taeOf(p){
  if(!isAmort(p))return null;const rows=amort(p);if(!rows.length)return null;
  const P=num(p.principal),fee=num(p.fee),ins=num(p.insAmount),f=ppy(p);
  const flows=rows.map(x=>x.pay+x.extra);let t0=P-fee;
  if(ins>0){if(p.insFreq==='each')flows.forEach((v,i)=>flows[i]+=ins);
    else if(p.insFreq==='once')t0-=ins;
    else if(p.insFreq==='annual'){const step=Math.max(1,Math.round(f));for(let k=0;k<flows.length;k+=step){if(k===0)t0-=ins;else flows[k-1]+=ins}}}
  if(t0<=0)return null;
  const npv=r=>flows.reduce((s,v,k)=>s+v/Math.pow(1+r,k+1),0)-t0;
  let lo=0,hi=1;if(npv(lo)<0)return 0;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(npv(m)>0)lo=m;else hi=m}
  return (Math.pow(1+lo,f)-1)*100;
}

function donut(parts,total,l1,l2,size=140,stroke=16){
  const c=size/2,r=c-stroke/2-2,C=2*Math.PI*r;let off=0;
  let s=`<svg viewBox="0 0 ${size} ${size}" class="${size>150?'ring':'donut'}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>`;
  parts.forEach(p=>{if(!p.v||!total)return;const len=Math.min(p.v/total,1)*C;
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${stroke}" stroke-linecap="${parts.length===1?'round':'butt'}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`;off+=len});
  const big=size>150;
  s+=`<text x="${c}" y="${c-(big?2:3)}" text-anchor="middle" class="dc1" style="font-size:${big?22:16}px">${esc(l1)}</text>`;
  s+=`<text x="${c}" y="${c+(big?20:14)}" text-anchor="middle" class="dc2" style="font-size:${big?12:10}px">${esc(l2)}</text></svg>`;
  return s;
}
/* bars: [{label, parts:[{v,color}], cur}] */
function barChart(bars){
  const W=340,H=180,pb=22,pt=16,ch=H-pb-pt,bw=W/Math.max(bars.length,1);
  const tot=b=>b.parts.reduce((s,x)=>s+x.v,0);const max=Math.max(1,...bars.map(tot));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  [0.5,1].forEach(f=>{const y=H-pb-ch*f;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`});
  bars.forEach((b,i)=>{
    const x=i*bw+bw*.17,w=bw*.66;let y=H-pb;
    b.parts.forEach(pp=>{if(!pp.v)return;const h=pp.v/max*ch;y-=h;s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${pp.color}"/>`});
    const tv=tot(b);if(tv&&bars.length<=16)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" class="vl">${compact(tv)}</text>`;
    if(bars.length<=16||i%Math.ceil(bars.length/12)===0)s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" class="ax${b.cur?' cur':''}">${esc(b.label)}</text>`;
  });
  return s+'</svg>';
}

  let a=s0?mo(s0.getFullYear(),s0.getMonth()):mo(tt.getFullYear(),tt.getMonth());
  const lo=mo(tt.getFullYear()-10,tt.getMonth()),a3=mo(tt.getFullYear(),tt.getMonth()-3);if(a<lo)a=lo;if(a>a3)a=a3;
  let b=mo(tt.getFullYear(),tt.getMonth()+24);if(e0&&e0>b)b=mo(e0.getFullYear(),e0.getMonth());const hi=mo(tt.getFullYear()+30,tt.getMonth());if(b>hi)b=hi;

    m.by[c]=(m.by[c]||0)+ev.amt;m.tot+=ev.amt;m.list.push({p,d:ev.d,amt:ev.amt})}));

    if(m.d.getMonth()===0||i===0)g+=`<text x="${x+bw/2}" y="${H-pb+28}" text-anchor="middle" class="ax">${m.d.getFullYear()}</text>`;
    g+=`<rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent" data-act="tlsel" data-v="${m.ym}"/>`;

    if(!s.done)h+=`<div class="note" style="margin-top:8px">${t('payoffNote',{b:money(s.balance)})}</div>`;

    h+=`</div>`;

    h+=`<div class="card"><h2>${t('loanCost')}</h2><div class="grid2">
    <div class="kv"><span>${p.partial?t('pendingAtStart'):t('borrowed')}</span><b>${money(P)}</b></div>
    <div class="kv"><span>${t('tin')}</span><b>${pct(num(p.rate))}</b></div>
    <div class="kv"><span>${t('calcMethodLbl')}</span><b>${t('m_'+p.calcMode)}</b></div>
    <div class="kv red"><span>${t('totalInterest')}</span><b>${money(s.intTotal)}</b></div>
    ${insTot?`<div class="kv"><span>${t('insTotal')}</span><b>${money(insTot)}</b></div>`:''}
    ${fee?`<div class="kv"><span>${t('feeLbl')}</span><b>${money(fee)}</b></div>`:''}
    <div class="kv red"><span>${t('totalCost')}</span><b>${money(s.intTotal+insTot+fee)}</b></div>
    <div class="kv"><span>${t('totalRepay')}</span><b>${money(P+s.intTotal+insTot+fee)}</b></div>
    ${tae!=null?`<div class="kv"><span>${t('tae')}</span><b>${pct(tae)}</b></div>`:''}</div>
    ${p.partial?`<div class="note" style="margin-top:10px">${t('partialNote',{d:fd(pd(p.start))})}</div>`:''}</div>`;

    // early repayments
    if(METHODS[p.calcMode].extras){const xs=extrasList(p);
      h+=`<div class="card"><h2>${t('extras')} ${xs.length?`<small>${money(xs.reduce((a,x)=>a+num(x.amt),0))}</small>`:''}</h2><div class="list">`+
      (xs.length?xs.map(x=>`<div class="it"><div class="ic" style="background:#30b15822">⤓</div><div class="mid"><div class="nm">${money(num(x.amt))}</div>
       <div class="meta">${ymLabel(x.ym)} · ${t(x.mode==='payment'?'xReducePay':'xReduceTerm')}</div></div>
       <button class="link" style="color:var(--danger);padding:0" data-act="rmExtra" data-id="${p.id}" data-x="${x.id}">${t('remove')}</button></div>`).join(''):`<div class="note">${t('noExtras')}</div>`)+
      `</div><button class="btn sec" data-act="addExtra" data-id="${p.id}">${t('addExtra')}</button></div>`}

    // yearly chart
    const ys={};s.rows.forEach(r=>{const y=r.d.getFullYear();(ys[y]=ys[y]||{i:0,c:0,n:0,x:0}).i+=r.it;ys[y].c+=r.cap;ys[y].x+=r.extra});
    events(p).filter(e=>e.k==='ins').forEach(e=>{const y=e.d.getFullYear();(ys[y]=ys[y]||{i:0,c:0,n:0,x:0}).n+=e.amt});
    const yk=Object.keys(ys).sort();
    h+=`<div class="card"><h2>${t('yearChart')}</h2>${barChart(yk.map(y=>({label:yk.length>8?"'"+String(y).slice(2):y,cur:+y===tt.getFullYear(),
      parts:[{v:ys[y].i,color:'#ff5a5f'},{v:ys[y].c,color:'#3a86ff'},{v:ys[y].x,color:'#30b158'},{v:ys[y].n,color:'#f4b400'}]})))}
    <div class="hleg"><span><i style="background:#ff5a5f"></i>${t('interest')}</span><span><i style="background:#3a86ff"></i>${t('capital')}</span>${s.extraTotal?`<span><i style="background:#30b158"></i>${t('extraLbl')}</span>`:''}${insTot?`<span><i style="background:#f4b400"></i>${t('ins')}</span>`:''}</div></div>`;
  }else if(s.hasEnd){
    h+=`<div class="ringwrap">${donut([{v:s.paidSum,color:c.color}],s.totalSum||1,Math.round(s.pct*100)+'%',s.done?t('finished').toLowerCase():t('paidWord'),190,18)}</div>
    <div class="card"><div class="grid2">
    <div class="kv"><span>${t('leftToPay')}</span><b>${money(s.leftSum)}</b></div>
    <div class="kv"><span>${t('paymentsLeft')}</span><b>${t('ofN',{a:s.leftN,b:s.totalN})}</b></div>
    <div class="kv"><span>${t('paidSoFar')}</span><b>${money(s.paidSum)}</b></div>
    <div class="kv"><span>${t('totalAll')}</span><b>${money(s.totalSum)}</b></div>
    <div class="kv"><span>${t('nextPayment')}</span><b>${s.next?fd(s.next):'—'}</b></div>
    <div class="kv"><span>${t('lastPayment')}</span><b>${fd(s.end)}</b></div></div>`;
    if(s.next)h+=`<div class="note" style="margin-top:10px">${t('nextIn',{a:money(sumAmt(s.nextEvents)),r:relDays(days(tt,s.next))})} ${s.leftN>1?t('finishedIn',{r:relDays(days(tt,s.end))}):t('lastOne')}</div>`;
    h+=`</div>`;
    const pr=num(p.principal);
    if(isLoanCat(p.cat)&&pr>0){const cost=s.totalSum-pr;
      h+=`<div class="card"><h2>${t('loanCost')}</h2><div class="grid2">
      <div class="kv"><span>${t('borrowed')}</span><b>${money(pr)}</b></div>
      <div class="kv"><span>${t('totalRepay')}</span><b>${money(s.totalSum)}</b></div>
      <div class="kv red"><span>${t('intFees')}</span><b>${money(cost)}</b></div>
      <div class="kv"><span>${t('costVs')}</span><b>${pct(cost/pr*100,1)}</b></div></div>
      <div class="note" style="margin-top:10px">${t('simpleNote')}</div></div>`;
    }
  }else{
    h+=`<div class="ringwrap">${donut([{v:1,color:c.color}],1,money0(perMonth(p)),t('perMonth'),190,18)}</div>
    <div class="card"><div class="grid2">
    <div class="kv"><span>${t('payment')}</span><b>${money(amt)} ${freqShort(p)}</b></div>
    <div class="kv"><span>${t('perYear')}</span><b>${money(perMonth(p)*12)}</b></div>
    <div class="kv"><span>${t('paidSoFar')}</span><b>${money(s.paidSum)}</b></div>
    <div class="kv"><span>${t('paymentsMade')}</span><b>${s.paidN}</b></div>
    <div class="kv"><span>${t('nextPayment')}</span><b>${s.next?fd(s.next):'—'}</b></div>
    <div class="kv"><span>${t('since')}</span><b>${fd(pd(p.start))}</b></div></div>
    <div class="note" style="margin-top:10px">${t('noEndNote')}</div>
    <button class="btn sec" data-act="finish" data-id="${p.id}">${t('stopToday')}</button></div>`;
  }

  h+=`<div class="card"><h2>${t('details')}</h2><div class="grid2">
  <div class="kv"><span>${t('amount')}</span><b>${money(amt)}</b></div><div class="kv"><span>${t('frequency')}</span><b>${freqLabel(p)}</b></div>
  <div class="kv"><span>${t('firstPayment')}</span><b>${fd(pd(p.start))}</b></div><div class="kv"><span>${t('ends')}</span><b>${s.hasEnd?fd(s.end):t('noEnd')}</b></div>
  ${isLoanLike(p)&&num(p.insAmount)&&p.insFreq!=='none'?`<div class="kv"><span>${t('insurance')}</span><b>${money(num(p.insAmount))} · ${t({each:'insEach',annual:'insAnnual',once:'insOnce'}[p.insFreq]||'insNone')}</b></div>`:''}
  ${m?`<div class="kv"><span>${t('method')}</span><b>${esc(m)}</b></div>`:''}</div>
  ${p.partial&&!s.amort?`<div class="note" style="margin-top:10px">${t('partialSimple')}</div>`:''}
  ${p.notes?`<div class="note" style="margin-top:10px">${esc(p.notes)}</div>`:''}</div>`;

  // schedule
  if(s.amort){
    const rows=s.rows;let ff=rows.findIndex(r=>r.d>tt);if(ff<0)ff=rows.length;
    let view=rows,more=false;if(!ui.showAll&&rows.length>12){const a=Math.max(0,ff-2);view=rows.slice(a,a+12);more=true}
    const insEach=p.insFreq==='each'?num(p.insAmount):0;
    h+=`<div class="card amt"><h2>${t('schedule')} <small>${t('nPayments',{n:rows.length})}</small></h2>
    <div class="r h"><span>${t('date')}</span><span>${t('payment')}</span><span>${t('interest')}</span><span>${t('capital')}</span><span>${t('balance')}</span></div>`+
    view.map(r=>{const paid=r.d<=tt,nx=s.nextRow&&+r.d===+s.nextRow.d;
      return `<div class="r${paid?' paid':''}${nx?' nx':''}"><span>${fdn(r.d)}</span><span>${money(r.pay+insEach)}</span><span>${money(r.it)}</span><span>${money(r.cap)}</span><span>${money(r.extra?r2(r.bal+r.extra):r.bal,r.bal>=1000?0:2)}</span></div>`+
      (r.extra?`<div class="r" style="color:var(--ok)"><span>⤓ ${t('extraRow')}</span><span>${money(r.extra)}</span><span></span><span>${money(r.extra)}</span><span>${money(r.bal,r.bal>=1000?0:2)}</span></div>`:'')}).join('')+
    (more?`<button class="link" data-act="showall">${t('showAll',{n:rows.length})}</button>`:ui.showAll&&rows.length>12?`<button class="link" data-act="showall">${t('showLess')}</button>`:'')+`</div>`;
  }else{
    const evs=s.hasEnd?events(p):events(p,null,new Date(tt.getFullYear()+1,tt.getMonth(),tt.getDate()));
    const g={};evs.forEach(e=>{const k=iso(e.d);(g[k]=g[k]||{d:e.d,amt:0}).amt+=e.amt});const list=Object.values(g);
    let ff=list.findIndex(x=>x.d>tt);if(ff<0)ff=list.length;
    let view=list,more=false;if(!ui.showAll&&list.length>10){const a=Math.max(0,ff-2);view=list.slice(a,a+10);more=true}
    h+=`<div class="card sched"><h2>${t('schedule')} <small>${t('nPayments',{n:list.length})}</small></h2>`+
     view.map(x=>{const paid=x.d<=tt,nx=s.next&&+x.d===+s.next;return `<div class="s${paid?' paid':''}${nx?' nx':''}"><span>${paid?'✓ ':nx?'→ ':''}${fd(x.d)}</span><span>${money(x.amt)}</span></div>`}).join('')+
     (more?`<button class="link" data-act="showall">${t('showAll',{n:list.length})}</button>`:ui.showAll&&list.length>10?`<button class="link" data-act="showall">${t('showLess')}</button>`:'')+`</div>`;
  }
  h+=`<button class="btn danger" data-act="del" data-id="${p.id}" style="margin-bottom:20px">${t('del')}</button>`;
  return h;
}

function catOptions(sel){const C=cats();return Object.values(C).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.icon} ${esc(c.label)}</option>`).join('')}

function readForm(){
  const e=ui.edit;if(!e)return;const g=id=>$('#'+id).value;
  e.name=g('f_name').trim();e.cat=g('f_cat');e.method=g('f_method');e.cur=g('f_cur');e.freq=g('f_freq');e.every=g('f_every');const S0=pd(g('f_start'));e.startKnown=!!S0;e.start=S0?iso(S0):'';e.dom='';e.partial=false;e.derived=false;
  e.notes=g('f_notes');e.insFreq=g('f_insFreq');e.insAmount=g('f_insAmount').trim();
  const loan=isLoanCat(e.cat);
  const nm=g('f_mode');
  if(nm!==e.calcMode){ // carry values over when switching between fixed payment and a calculation
    if(e.calcMode==='simple'||!e.calcMode){if(!$('#f_fprincipal').value)$('#f_fprincipal').value=$('#f_principal').value;if(!$('#f_term').value)$('#f_term').value=$('#f_count').value;if(!$('#f_fpay').value)$('#f_fpay').value=$('#f_amount').value;
      if(!$('#f_fend').value&&$('#f_end').value)$('#f_fend').value=$('#f_end').value;
      e.given=[['P','f_fprincipal'],['r','f_rate'],['n','f_term'],['A','f_fpay']].filter(([k,id])=>$('#'+id).value.trim()).map(x=>x[0])}
    else if(nm==='simple'){if(!$('#f_amount').value)$('#f_amount').value=e.amount;$('#f_count').value=e.count;$('#f_principal').value=e.principal;if(e.count)e.endType='count'}
    e.calcMode=nm}
  const am=e.calcMode!=='simple'&&e.freq!=='once';
  if(am){
    e.fee=g('f_fee').trim();e.endType='count';e.calcErr=null;
    const E0=pd(g('f_fend'));e.fend=E0?iso(E0):'';
    const F={P:'f_fprincipal',r:'f_rate',n:'f_term',A:'f_fpay'};
    const raw={P:g(F.P).trim(),r:g(F.r).trim(),n:g(F.n).trim(),A:g(F.A).trim()};
    const v={P:num(raw.P),r:num(raw.r),n:parseInt(raw.n)||0,A:num(raw.A)};
    const has=k=>k==='r'?raw.r!==''&&v.r>=0:v[k]>0;
    let giv=(e.given||[]).filter(has),fixedN=false;
    if(S0&&E0){v.n=E0>=S0?countBetween(S0,E0,e):0;fixedN=true}
    else if(!S0&&E0&&!giv.includes('n')){v.n=remainingFromToday(E0,e);fixedN=true;e.partial=true}
    const keep=fixedN?giv.filter(k=>k!=='n').slice(-2).concat(v.n>0?['n']:[]):giv.slice(-3);
    e.given=keep.filter(k=>!(fixedN&&k==='n'));
    const calcK=keep.length===3?['P','r','n','A'].find(k=>!keep.includes(k)):null;
    // clear values that were calculated earlier but can't be calculated now
    Object.keys(F).forEach(k=>{const el=$('#'+F[k]);if(el.classList.contains('calc')&&k!==calcK&&!(k==='n'&&fixedN)){el.value='';v[k]=0;raw[k]=''}});
    const m=e.calcMode,pp=ppy(e),rp=v.r/100/pp,first=METHODS[m].first;
    if(calcK==='A')v.A=r2(first(v.P,rp,v.n));
    else if(calcK==='P'){const f=first(1,rp,v.n);v.P=f>0?r2(v.A/f):0}
    else if(calcK==='n'){const n=termFor(m,v.P,rp,v.A);if(n<0){e.calcErr=n===-2?'termNeeded':'payTooLow';v.n=0}else v.n=n}
    else if(calcK==='r'){const x=rateFor(m,v.P,v.n,v.A);if(x==null){e.calcErr='rateImpossible';v.r=0}else v.r=Math.round(x*pp*100*1000)/1000}
    Object.keys(F).forEach(k=>{const el=$('#'+F[k]),isC=k===calcK||(k==='n'&&fixedN);el.classList.toggle('calc',isC);
      if(isC)el.value=(v[k]||(k==='r'&&calcK==='r'&&!e.calcErr))?String(v[k]):''});
    $('#f_term').readOnly=fixedN;
    e.rate=(raw.r!==''||calcK==='r')&&!e.calcErr?String(v.r):(raw.r!==''?String(v.r):'');
    e.principal=v.P||'';e.count=v.n||'';e.amount=v.A||'';
    if(!S0&&E0&&v.n>0){e.start=iso(shiftP(E0,-(v.n-1),e));e.dom=E0.getDate();e.derived=true}
    if(m!=='french'){const rows=amort(e);if(rows.length)e.amount=rows[0].pay}
  }else{
    e.amount=g('f_amount').trim();e.end=g('f_end');e.count=g('f_count');e.principal=g('f_principal').trim();
    const E=pd(e.end);

function preview(){return withCur(curOf(ui.edit),previewInner)}
function previewInner(){
  const e=ui.edit,pv=$('#preview');
  if(isAmort(e)){
    if(e.calcErr){pv.textContent=t(e.calcErr);return}
    if(!(num(e.principal)>0&&num(e.amount)>0&&parseInt(e.count)>0&&pd(e.start))){pv.textContent=t('needFrench');return}
    const s=stats(e),tae=taeOf(e),insT=s.insPaid+s.insLeft,fee=num(e.fee),rw=s.rows;
    pv.innerHTML=(isFrench(e)&&!s.extraTotal?t('pvFrench',{a:money(num(e.amount)),n:rw.length,i:money(s.intTotal)}):t('pvVar',{a:money(rw[0].pay),b:money(rw[rw.length-1].pay),n:rw.length,i:money(s.intTotal)}))+(insT?'<br>'+t('pvIns',{v:money(insT)}):'')+
      '<br>'+t('pvTotalCost',{v:money(s.intTotal+insT+fee),tae:tae!=null?pct(tae):'—'})+'<br>'+t('pvPaidLeft',{p:s.paidN,b:money(s.balance)})+derivedLine(e);
    return;
  }
  const a=num(e.amount);if(!a||!pd(e.start)){pv.textContent=t('previewEmpty');return}
  const s=stats(e);
  if(s.hasEnd){if(!s.totalN){pv.textContent=t('previewNone');return}
    pv.innerHTML=t('pvFixed',{n:s.totalN,t:money(s.totalSum),p:s.paidN,l:s.leftN,ls:money(s.leftSum),d:fd(s.end)})+
      (isLoanCat(e.cat)&&num(e.principal)>0?'<br>'+t('pvInterest',{v:money(s.totalSum-num(e.principal))}):'');
    pv.innerHTML+=derivedLine(e);

}
function saveItem(){

}

    case'wprio':ui.we.prio=+b.dataset.v;document.querySelectorAll('#w_prio button').forEach(x=>x.classList.toggle('on',x===b));break;
    case'wclrT':$('#w_target').value='';break;

    case'tlsel':ui.tlSel=b.dataset.v;ui.tlKeep=true;render();break;
    case'saveCat':saveCat();break;
    case'resetCat':if(state.catEdit){delete state.catEdit[ui.cat];save();render()}settings();break;
    case'rmCur':{const c=b.dataset.v,n=state.items.filter(p=>curOf(p)===c).length;if(n){toast(t('curInUse',{c,n}));break}
      state.currencies=(state.currencies||[]).filter(x=>x!==c);if(state.rates)delete state.rates[c];save();render();settings();break}
    case'addCurE':{const c=addCurrency(prompt(t('promptCur'))||'');if(c){$('#f_cur').innerHTML=curOptions(c);readForm()}else toast(t('errCur'));break}
    case'addMethodS':if(addMethod())settings();break;
    case'rmMethod':{const m=state.methods.find(x=>x.id===id);if(m&&confirm(t('confirmRemove',{n:m.name}))){state.methods=state.methods.filter(x=>x.id!==id);
      state.items.forEach(p=>{if(p.method===id)p.method=''});save();settings();render()}break}
    case'rmCat':{const c=state.cats.find(x=>x.id===id);if(c&&confirm(t('confirmRemove',{n:c.label}))){state.cats=state.cats.filter(x=>x.id!==id);
      state.items.forEach(p=>{if(p.cat===id)p.cat='other'});save();settings();render()}break}
    case'setLang':state.lang=b.dataset.v;save();render();b.dataset.keep?settings():closeSheet();break;
    case'langs':langSheet();break;
    case'finish':{const p=state.items.find(x=>x.id===id);if(p&&confirm(t('confirmStop',{n:p.name}))){p.endType='date';p.end=iso(today());save();render();toast(t('tFinished'))}break}
    case'del':{const p=state.items.find(x=>x.id===id);if(p&&confirm(t('confirmDelete',{n:p.name}))){state.items=state.items.filter(x=>x.id!==id);save();ui.detail=null;render();toast(t('tDeleted'))}break}
    case'settings':settings();break;
    case'export':exportData();break;
    case'import':$('#importFile').click();break;
    case'sample':sample();break;
    case'wipe':if(confirm(t('confirmWipe'))){state.items=[];save();closeSheet();ui.detail=null;render()}break;
  }
});

/* =====================================================================
   WISHLIST & SAVINGS
   A wish is a single item, or a project with parts (each part has its own price, link and photo).
   ===================================================================== */
const WCATS={electronics:['📱','#3a86ff'],clothes:['👗','#ef476f'],home:['🛋️','#9b5de5'],vehicle:['🏍️','#ff8c42'],kids:['🧸','#f4b400'],travel:['✈️','#2ec4b6'],gifts:['🎁','#06d6a0'],other:['🛍️','#8d99ae']};
const PRIO={1:'#ff3b30',2:'#0a84ff',3:'#8e8e93'};
const wcat=k=>{const id=WCATS[k]?k:'other';return {id,icon:WCATS[id][0],color:WCATS[id][1],label:t('w_'+id)}};
const wishes=()=>state.wish||(state.wish=[]);
const slog=()=>{if(!state.savings||!Array.isArray(state.savings.log))state.savings={log:[]};return state.savings.log};
const savedFor=id=>r2(slog().filter(x=>x.item===id).reduce((a,x)=>a+x.amt,0));
function savTotals(cur){const L=slog().filter(x=>x.cur===cur),total=L.reduce((a,x)=>a+x.amt,0),free=L.filter(x=>!x.item).reduce((a,x)=>a+x.amt,0);return {total:r2(total),free:r2(free),reserved:r2(total-free)}}
function addLog(amt,cur,item,note){amt=r2(amt);if(!isFinite(amt)||Math.abs(amt)<0.005)return;slog().push({id:uid(),date:iso(today()),amt,cur,item:item||null,note:note||''})}
function savCurs(){const u=new Set(slog().map(x=>x.cur).concat(wishes().filter(w=>!w.bought).map(curOf)));return curList().filter(c=>u.has(c)).concat([...u].filter(c=>!curList().includes(c)))}
function monthsTo(ym){if(!ym)return null;const [y,m]=String(ym).split('-').map(Number);if(!y||!m)return null;const tt=today();return (y-tt.getFullYear())*12+(m-1-tt.getMonth())}
const isProj=w=>w.type==='project';
const partsOf=w=>Array.isArray(w.parts)?w.parts:[];
const wTotal=w=>isProj(w)?partsOf(w).reduce((a,x)=>a+num(x.price),0):num(w.price);                 // full price
const wLeft=w=>isProj(w)?partsOf(w).filter(x=>!x.bought).reduce((a,x)=>a+num(x.price),0):num(w.price); // still to buy
const wDoneV=w=>isProj(w)?partsOf(w).filter(x=>x.bought).reduce((a,x)=>a+num(x.price),0):0;         // already bought (list price)
function wishNeed(w){const left=Math.max(0,wLeft(w)-savedFor(w.id)),mt=monthsTo(w.target);if(!(left>0)||mt==null)return null;return left/Math.max(1,mt)}
function targetTxt(w){const mt=monthsTo(w.target);if(mt==null)return '';const [y,m]=w.target.split('-').map(Number);
  const lbl=new Date(y,m-1,1).toLocaleDateString(loc(),{month:'short',year:'numeric'}).replace('.','');
  return lbl+' · '+(mt<0?t('overdue'):mt===0?t('thisMonth'):mt===1?t('nextMonth'):t('inMonths',{n:mt}))}
/* links and picture links are stored as typed, never opened by the app; only http(s) ones are ever used */
const safeUrl=u=>{u=String(u||'').trim();return /^https?:\/\/\S+$/i.test(u)?u.replace(/["'<>`]/g,c=>encodeURIComponent(c)):''};
const safeImg=u=>{u=String(u||'');return u.startsWith('data:image/')?u:safeUrl(u)};
const storeOf=u=>{try{return new URL(safeUrl(u)).hostname.replace(/^www\./,'')}catch(e){return ''}};
const imgTag=(src,fb)=>{const u=safeImg(src);return u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.outerHTML='${fb}'">`:fb};
const wThumb=w=>imgTag(w.img||(isProj(w)?(partsOf(w).find(x=>safeImg(x.img))||{}).img:''),wcat(w.cat).icon);

/* best combinations of wishes that fit into budget B (only "full" sets: nothing else would still fit) */
function combos(cur,B){
  const c=wishes().filter(w=>!w.bought&&curOf(w)===cur&&wLeft(w)>0&&wLeft(w)<=B+0.004)
    .sort((a,b)=>(a.prio||2)-(b.prio||2)||(a.target||'9').localeCompare(b.target||'9')).slice(0,16);
  const n=c.length,res=[];
  for(let mask=1;mask<(1<<n);mask++){let s=0,sc=0,ok=true;for(let i=0;i<n;i++)if(mask>>i&1){s+=wLeft(c[i]);sc+=[0,9,4,1][c[i].prio||2];if(s>B+0.004){ok=false;break}}
    if(ok&&!c.some((w,i)=>!(mask>>i&1)&&s+wLeft(w)<=B+0.004))res.push({mask,s,sc})}
  res.sort((a,b)=>b.sc-a.sc||b.s-a.s);
  return res.slice(0,3).map(r=>({items:c.filter((w,i)=>r.mask>>i&1),sum:r.s}));
}

function wishView(){
  const all=wishes(),open=all.filter(w=>!w.bought),bought=all.filter(w=>w.bought);
  let h=header(t('wishlist'),open.length?t('items',{n:open.length})+' · '+perCur(open,w=>wLeft(w),0):t('items',{n:0}));
  if(!all.length)return h+`<div class="card empty"><div class="e1">🎁</div><h2 style="justify-content:center">${t('emptyWish')}</h2><p>${t('emptyWishText')}</p><button class="btn" data-act="new">${t('addWish')}</button></div>`;
  const used=[...new Set(open.map(w=>wcat(w.cat).id))];
  if(used.length>1)h+=`<div class="chips"><button data-act="wfilter" data-v="" class="${!ui.wf?'on':''}">${t('allF')}</button>${used.map(k=>`<button data-act="wfilter" data-v="${k}" class="${ui.wf===k?'on':''}">${wcat(k).icon} ${wcat(k).label}</button>`).join('')}</div>`;
  const list=open.filter(w=>!ui.wf||wcat(w.cat).id===ui.wf).sort((a,b)=>(a.target||'9999').localeCompare(b.target||'9999')||(a.prio||2)-(b.prio||2));
  ui.popen=ui.popen||{};
  const row=(w,i)=>{try{
    const c=wcat(w.cat),cur=curOf(w),tot=wTotal(w),left=wLeft(w),sv=savedFor(w.id),pj=isProj(w),P=partsOf(w),bn=P.filter(x=>x.bought).length;
    const pc=w.bought?1:tot>0?Math.min(1,(wDoneV(w)+sv)/tot):0,ready=!w.bought&&left>0&&sv>=left-0.004,col=pc>=0.85?'#30b158':c.color,need=wishNeed(w),st=storeOf(w.link);
    const tog=pj?`<span class="tog" data-act="ptog" data-id="${w.id}">${ui.popen[w.id]?'▴':'▾'} ${t('partsLeft',{a:bn,n:P.length})}</span> `:'';
    const meta=w.bought?t('boughtOn',{d:fd(pd(w.boughtDate)),v:money(num(w.boughtPrice),2,cur)}):
      tog+(ready?t('readyBuy'):`<i class="pd" style="background:${PRIO[w.prio||2]}"></i>${[targetTxt(w),pj?'':st].filter(Boolean).join(' · ')||t('pr'+(w.prio||2))}`);
    let r=`<button class="prow" data-act="wopen" data-id="${w.id}" style="--p:${(pc*100).toFixed(1)}%;--c1:${rgba(col,.07)};--c2:${rgba(col,.30)};--ce:${rgba(col,.8)};animation-delay:${Math.min(i,12)*35}ms">
     ${pc>0&&!w.bought?'<span class="pfill"></span>':''}<span class="wimg" style="background:${rgba(c.color,.14)}">${pj&&!w.img?'📦':wThumb(w)}</span>
     <span class="mid"><span class="nm">${esc(w.name)}</span><span class="meta">${meta}</span></span>
     <span class="rt">${tot?money(tot,tot>=1000?0:2,cur):'—'}${w.bought?'':pj&&bn&&left?`<small>${t('leftSave')}: ${money0(Math.max(0,left-sv),cur)}</small>`:sv>0&&!ready?`<small>${t('savedPct',{p:Math.round(pc*100)})}</small>`:need&&!ready?`<small>${money0(need,cur)}${t('s_monthly')}</small>`:''}</span></button>`;
    if(pj&&ui.popen[w.id])r+=`<div class="subl">${P.map(x=>`<div class="sl${x.bought?' done':''}"><span class="pth">${imgTag(x.img,'·')}</span><span class="n">${esc(x.name)}</span><span class="v">${x.price!==''&&x.price!=null?money(num(x.price),2,cur):'—'}</span>${x.bought?'✓':''}</div>`).join('')}</div>`;
    return r}catch(err){return ''}};
  h+=`<div class="plist" style="margin-top:6px">${list.map(row).join('')}</div>`;
  if(bought.length){
    h+=`<button class="btn sec" data-act="wshowb" style="margin-top:16px">${ui.showBought?t('hideBought'):t('showBought',{n:bought.length})}</button>`;
    if(ui.showBought)h+=`<div class="sect">${t('purchased')}</div><div class="plist" style="opacity:.75">${bought.sort((a,b)=>(b.boughtDate||'').localeCompare(a.boughtDate||'')).map(row).join('')}</div>`;
  }
  return h;
}

function savView(){
  let h=header(t('savingsTab'),'');
  const curs=savCurs();
  if(!curs.length)return h+`<div class="card empty"><div class="e1">🐷</div><p>${t('noSav')}</p><button class="btn" data-act="new">${t('addSav')}</button></div>`;
  curs.forEach(cur=>{
    const T0=savTotals(cur);
    h+=`<div class="hero sav"><div class="lbl">${t('totalSaved')}${curs.length>1?' · '+cur:''}</div><div class="big">${money(T0.total,2,cur)}</div>
     <div class="row"><div class="pill"><b>${money0(T0.free,cur)}</b><span>${t('freeSav')}</span></div><div class="pill"><b>${money0(T0.reserved,cur)}</b><span>${t('reservedSav')}</span></div></div></div>
     <div class="grid2" style="margin-top:-4px"><button class="btn" style="background:#1fa463" data-act="sdep" data-v="${cur}">${t('addSav')}</button><button class="btn sec" data-act="swd" data-v="${cur}">${t('withdraw')}</button></div>`;
    const open=wishes().filter(w=>!w.bought&&curOf(w)===cur);
    const needSum=open.reduce((a,w)=>a+(wishNeed(w)||0),0);
    if(open.length){
      const cs=combos(cur,T0.total);
      h+=`<div class="card"><h2>${t('canBuy')} <small>${money0(T0.total,cur)}</small></h2>`+
        (cs.length?cs.map((c,i)=>`<div class="combo">${cs.length>1?`<div class="note" style="margin-bottom:6px">${t('combo',{n:i+1})}</div>`:''}<div class="cl">${c.items.map(w=>`<span data-act="wopen" data-id="${w.id}"><i>${isProj(w)&&!w.img?'📦':wThumb(w)}</i>${esc(w.name)}${isProj(w)?` · ${money0(wLeft(w),cur)}`:''}</span>`).join('')}</div>
          <div class="ct"><b>${money(c.sum,2,cur)}</b><span>${t('leftAfter',{v:money(T0.total-c.sum,2,cur)})}</span></div></div>`).join(''):`<div class="note">${t('canBuyNone')}</div>`)+
        (needSum?`<div class="note" style="margin-top:10px">${t('needAll',{v:money0(needSum,cur)})}</div>`:'')+`</div>`;
    }
  });
  const L=slog().slice().reverse().slice(0,40);
  if(L.length){const wn=id=>{const w=wishes().find(x=>x.id===id);return w?w.name:''};
    h+=`<div class="card"><h2>${t('history')}</h2>`+L.map(x=>`<div class="logr"><span class="n">${x.item?'🎯 '+esc(wn(x.item)):esc(x.note||t('freeLbl'))}</span><span class="d">${fds(pd(x.date)||today())}</span>
      <span class="v${x.amt>0?' pos':''}">${x.amt>0?'+':''}${money(x.amt,2,x.cur)}</span><button data-act="rmlog" data-id="${x.id}" aria-label="×">×</button></div>`).join('')+`</div>`}
  return h;
}

function savSheet(kind,id,cur){
  const w=id&&wishes().find(x=>x.id===id);cur=w?curOf(w):(cur||savCurs()[0]||state.currency);
  ui.ss={kind,id,mode:'new',cur};
  const title=kind==='dep'?t('addSavTitle'):kind==='wd'?t('withdrawTitle'):t('saveForTitle',{n:w.name});
  openSheet(`<div class="bar0"><button data-act="close">${t('cancel')}</button><b style="max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</b><button class="done" data-act="savOk">${t('save')}</button></div><div class="wrap">
   <div class="fg"><div class="fr"><label>${t('amount')}</label><input id="s_amt" inputmode="decimal" placeholder="0,00"></div>
   <div class="fr"><label>${t('currency')}</label>${w?`<span style="flex:1;text-align:right">${cur}</span>`:`<select id="s_c">${curOptions(cur)}</select>`}</div>
   ${kind!=='item'?`<div class="fr"><label>${t('note')}</label><input id="s_note" placeholder="${kind==='dep'?t('sw_sav'):t('optional')}"></div>`:''}</div>

  </div>`);
  setTimeout(()=>{const i=$('#s_amt');if(i)i.focus()},350);
}
function savOk(){
  const k=ui.ss,amt=num($('#s_amt').value);if(!(amt>0))return toast(t('errAmount'));
  if(k.kind==='item'){const w=wishes().find(x=>x.id===k.id),cur=curOf(w);
    if(k.mode==='free'){const fr=Math.max(0,savTotals(cur).free),use=Math.min(fr,amt);addLog(-use,cur,null,w.name);if(amt-use>0.004)setTimeout(()=>toast(t('fromFreeTooMuch',{v:money(fr,2,cur)})),400)}
    addLog(amt,cur,w.id,'');save();closeSheet();render();setTimeout(()=>wDetail(w.id),320);return}
  const cur=$('#s_c').value;addLog(k.kind==='wd'?-amt:amt,cur,null,$('#s_note').value.trim());
  save();closeSheet();render();toast(t('tSaved'));
}

function wDetail(id){
  const w=wishes().find(x=>x.id===id);if(!w)return;
  CURX=curOf(w);try{
  const c=wcat(w.cat),pj=isProj(w),P=partsOf(w),tot=wTotal(w),left=wLeft(w),sv=savedFor(w.id),need=wishNeed(w),st=storeOf(w.link),lk=safeUrl(w.link);
  const pc=tot>0?Math.min(1,(wDoneV(w)+sv)/tot):0,cover=safeImg(w.img);
  openSheet(`<div class="bar0"><button data-act="close">${t('done')}</button><b></b><button data-act="wedit" data-id="${w.id}">${t('edit')}</button></div><div class="wrap">
   ${cover?`<img class="wphoto" src="${esc(cover)}" alt="" onerror="this.remove()">`:`<div style="font-size:64px;text-align:center;margin:18px 0 6px">${pj?'📦':c.icon}</div>`}
   <div class="dtitle"><h1 style="font-size:22px">${esc(w.name)}</h1>
    <span class="chip" style="background:${c.color}22;color:${c.color}">${c.icon} ${esc(c.label)}</span><span class="chip m"><i class="pd" style="background:${PRIO[w.prio||2]}"></i>${t('pr'+(w.prio||2))}</span>${w.target?`<span class="chip m">${esc(targetTxt(w))}</span>`:''}</div>
   ${lk?`<a class="btn sec" href="${esc(lk)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${t('openStore',{s:esc(st||'link')})} ↗</a>`:''}
   ${w.bought?`<div class="card"><div class="grid2"><div class="kv"><span>${t('pricePaid')}</span><b>${money(num(w.boughtPrice))}</b></div><div class="kv"><span>${t('date')}</span><b>${fd(pd(w.boughtDate))}</b></div></div></div>
     <button class="btn sec" data-act="wunbuy" data-id="${w.id}">${t('moveBack')}</button>`:
   `<div class="card"><h2>${tot?money(tot):'—'} <small>${pj?t('partsLeft',{a:P.filter(x=>x.bought).length,n:P.length})+' · ':''}${t('savedOf',{a:money(sv),b:left?money(left):'—'})}</small></h2>
     <div class="bar" style="height:10px;border-radius:5px"><i style="width:${(pc*100).toFixed(1)}%;background:${pc>=0.85?'#30b158':c.color}"></i></div>
     <div class="grid2" style="margin-top:12px"><div class="kv"><span>${t('leftSave')}</span><b>${money(Math.max(0,left-sv))}</b></div><div class="kv"><span>${t('perMonthNeed')}</span><b>${need?money(need):'—'}</b></div></div>
     <button class="btn" style="background:#1fa463" data-act="wsave" data-id="${w.id}">${t('saveFor')}</button></div>
    ${pj?'':`<button class="btn" data-act="wbuy" data-id="${w.id}">✓ ${t('markBought')}</button>`}`}
   ${pj?`<div class="card"><h2>${t('parts')} <small>${t('total')} ${money(tot)}</small></h2>${P.map(x=>{const pl=safeUrl(x.link);return `<div class="ppr${x.bought?' done':''}"><span class="pth" style="width:44px;height:44px;border-radius:10px">${imgTag(x.img,'·')}</span>
      <span class="n"><b>${esc(x.name)}</b>${x.bought?`<small>${t('boughtOn',{d:fd(pd(x.date)),v:money(num(x.paid))})}</small>`:pl?`<a href="${esc(pl)}" target="_blank" rel="noopener noreferrer">${esc(storeOf(pl))} ↗</a>`:''}</span>
      <span class="v">${x.price!==''&&x.price!=null?money(num(x.price)):'—'}</span>
      ${w.bought?'':x.bought?`<button class="pb u" data-act="punbuy" data-id="${w.id}" data-p="${x.id}">${t('undo')}</button>`:`<button class="pb" data-act="pbuy" data-id="${w.id}" data-p="${x.id}">${t('buyPart')}</button>`}</div>`}).join('')}</div>`:''}
   ${w.notes?`<div class="card note">${esc(w.notes)}</div>`:''}
   <button class="btn danger" data-act="wdel" data-id="${w.id}" style="margin-bottom:20px">${t('remove')}</button>
  </div>`);
  }finally{CURX=null}
}

function wBuySheet(id,pid){
  const w=wishes().find(x=>x.id===id);if(!w)return;const part=pid?partsOf(w).find(x=>x.id===pid):null;if(pid&&!part)return;
  const cur=curOf(w),sv=savedFor(id),T0=savTotals(cur),price=part?num(part.price):num(w.price);
  ui.wb={id,pid,pay:sv>0||T0.free>=price};
  openSheet(`<div class="bar0"><button data-act="close">${t('cancel')}</button><b style="max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(part?part.name:t('buyTitle'))}</b><button class="done" data-act="wbuyOk">${t('save')}</button></div><div class="wrap">
   <div class="fg"><div class="fr"><label>${t('pricePaid')}</label><input id="b_price" inputmode="decimal" value="${price||''}"><span class="unit">${cur}</span></div>
   <div class="fr"><label>${t('date')}</label><input id="b_date" type="date" value="${iso(today())}"></div></div>
   <div class="lbl2">${t('payFromSav')} · ${money0(T0.total,cur)}</div>
   <div class="seg" id="b_pay"><button type="button" data-act="bpay" data-v="1" class="${ui.wb.pay?'on':''}">${t('yes')}</button><button type="button" data-act="bpay" data-v="0" class="${ui.wb.pay?'':'on'}">${t('no')}</button></div></div>`);
}
function wBuyOk(){
  const k=ui.wb,w=wishes().find(x=>x.id===k.id);if(!w)return;
  const cur=curOf(w),res=savedFor(w.id),date=$('#b_date').value||iso(today());
  if(k.pid){
    const part=partsOf(w).find(x=>x.id===k.pid);if(!part)return;const paid=num($('#b_price').value)||num(part.price);
    if(k.pay){const use=Math.max(0,Math.min(res,paid));addLog(-use,cur,w.id,'');addLog(-(paid-use),cur,null,t('boughtLbl',{n:part.name}))}
    part.bought=true;part.paid=r2(paid);part.date=date;
    if(partsOf(w).every(x=>x.bought)){const r=savedFor(w.id);addLog(-r,cur,w.id,'');addLog(r,cur,null,w.name);
      w.bought=true;w.boughtDate=date;w.boughtPrice=r2(partsOf(w).reduce((a,x)=>a+num(x.paid),0));save();closeSheet();render();toast(t('projDone'));return}
    save();closeSheet();render();setTimeout(()=>wDetail(w.id),320);return;
  }
  const paid=num($('#b_price').value)||num(w.price);
  addLog(-res,cur,w.id,'');                                    // release what was reserved for it
  if(k.pay)addLog(res-paid,cur,null,t('boughtLbl',{n:w.name})); // pay: reserved covers part, the rest comes from free savings
  else addLog(res,cur,null,w.name);                            // paid elsewhere: reserved money becomes free again
  w.bought=true;w.boughtPrice=r2(paid);w.boughtDate=date;
  save();closeSheet();render();toast('🎉 '+t('tSaved'));
}

/* ---------- editor ---------- */
function wEditor(w){
  const isNew=!w;
  ui.we=w?JSON.parse(JSON.stringify(w)):{id:uid(),type:'single',name:'',price:'',cur:ui.dcur||state.currency,cat:'other',prio:2,target:'',link:'',img:'',notes:'',parts:[]};
  const e=ui.we;e.type=e.type||'single';e.parts=partsOf(e);if(e.type==='project'&&!e.parts.length)e.parts.push(newPart());
  openSheet(`<div class="bar0"><button data-act="close">${t('cancel')}</button><b>${isNew?t('newWish'):t('editWish')}</b><button class="done" data-act="wsaveItem">${t('save')}</button></div><div class="wrap">
   <div class="seg" id="w_type"><button type="button" data-act="wtype" data-v="single">🛍️ ${t('single')}</button><button type="button" data-act="wtype" data-v="project">📦 ${t('project')}</button></div>
   <div class="fg"><div class="fr"><label>${t('name')}</label><input id="w_name" value="${esc(e.name)}" autocomplete="off"></div>
    <div class="fr" id="r_wprice"><label>${t('price')}</label><input id="w_price" inputmode="decimal" placeholder="0,00" value="${esc(e.price)}"></div>
    <div class="fr"><label>${t('currency')}</label><select id="w_cur">${curOptions(curOf(e))}</select></div>
    <div class="fr"><label>${t('category')}</label><select id="w_cat">${Object.keys(WCATS).map(k=>`<option value="${k}" ${wcat(e.cat).id===k?'selected':''}>${WCATS[k][0]} ${t('w_'+k)}</option>`).join('')}</select></div>
    <div class="fr"><label>${t('target')}</label><input id="w_target" type="month" value="${esc(e.target)}"><button type="button" class="plus" data-act="wclrT" aria-label="×">×</button></div>
    <div class="fr"><label>${t('link')}</label><input id="w_link" type="url" inputmode="url" autocomplete="off" placeholder="${t('linkPh2')}" value="${esc(e.link)}"></div></div>
   <div id="projBlock"><div class="lbl2">${t('parts')} · <span id="p_total"></span></div><div class="fg tight" id="p_list"></div>
    <button type="button" class="btn sec" data-act="paddp" style="margin-top:-4px">${t('addPart')}</button></div>
   <div class="lbl2">${t('photo')}</div>
   <div class="fg tight"><div class="imgs" id="w_imgs"></div><div class="fr"><label>${t('photoLink')}</label><input id="w_imgurl" type="url" inputmode="url" autocomplete="off" placeholder="${t('photoLinkPh')}" value="${esc(/^https?:/.test(e.img||'')?e.img:'')}"></div></div>
   <input type="file" id="w_file" accept="image/*" class="hide"><input type="file" id="p_file" accept="image/*" class="hide">
   <div class="lbl2">${t('priority')}</div>
   <div class="seg" id="w_prio">${[1,2,3].map(n=>`<button type="button" data-act="wprio" data-v="${n}" class="${(e.prio||2)==n?'on':''}"><i class="pd" style="background:${PRIO[n]}"></i>${t('pr'+n)}</button>`).join('')}</div>
   <div class="fg"><div class="fr col"><label>${t('notes')}</label><textarea id="w_notes">${esc(e.notes)}</textarea></div></div>
  </div>`);
  wTypeUI();drawImgs();drawParts();
  const fileTo=async(f,cb)=>{if(!f)return;try{const d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});cb(await resizeImg(d,700))}catch(err){toast('⚠️')}};
  $('#w_file').addEventListener('change',ev=>{fileTo(ev.target.files[0],d=>{ui.we.img=d;$('#w_imgurl').value='';drawImgs()});ev.target.value=''});
  $('#p_file').addEventListener('change',ev=>{const i=ui.pi;fileTo(ev.target.files[0],d=>{readParts();if(ui.we.parts[i]){ui.we.parts[i].img=d;drawParts()}});ev.target.value=''});
  $('#w_imgurl').addEventListener('input',ev=>{const u=safeUrl(ev.target.value);if(u){ui.we.img=u;drawImgs()}else if(!ev.target.value.trim()&&/^https?:/.test(ui.we.img||'')){ui.we.img='';drawImgs()}});
  $('#p_list').addEventListener('input',()=>{readParts();updTotal()});
}
const newPart=()=>({id:uid(),name:'',price:'',link:'',img:'',bought:false});
function wTypeUI(){const pj=ui.we.type==='project';document.querySelectorAll('#w_type button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.we.type));
  $('#r_wprice').classList.toggle('hide',pj);$('#projBlock').classList.toggle('hide',!pj)}
function drawImgs(){
  const u=safeImg(ui.we.img);
  $('#w_imgs').innerHTML=(u?`<button type="button" class="on" data-act="wimgclr"><img src="${esc(u)}" alt="" onerror="this.parentNode.style.opacity='.3'"></button>`:'')+
    `<button type="button" class="up" data-act="wupload">📷<br>${t('upload')}</button>`;
}
function drawParts(){
  const cur=$('#w_cur')?$('#w_cur').value:state.currency;
  $('#p_list').innerHTML=ui.we.parts.map((p,i)=>`<div class="prt">
    <div class="fr"><span class="pth" data-act="pphoto" data-i="${i}">${imgTag(p.img,'📷')}</span>
     <input class="p_name" placeholder="${t('partName')}" value="${esc(p.name)}" style="text-align:left" ${p.bought?'disabled':''}>
     <input class="p_price" inputmode="decimal" placeholder="0,00" value="${esc(p.price)}" style="flex:none;width:80px" ${p.bought?'disabled':''}>
     <button type="button" class="plus" data-act="pmore" data-i="${i}">⋯</button></div>
    <div class="pm ${p._open?'':'hide'}"><div class="fr"><label>${t('link')}</label><input class="p_link" type="url" inputmode="url" placeholder="https://" value="${esc(p.link)}"></div>
     <div class="fr"><label>${t('photoLink')}</label><input class="p_img" type="url" inputmode="url" placeholder="https://" value="${esc(/^https?:/.test(p.img||'')?p.img:'')}"></div>
     <div class="fr"><button type="button" class="link" style="padding:0" data-act="pphoto" data-i="${i}">📷 ${t('upload')}</button><span style="flex:1"></span>
      <button type="button" class="link" style="color:var(--danger);padding:0" data-act="pdel" data-i="${i}">${t('remove')}</button></div></div></div>`).join('');
  updTotal();
}
function readParts(){
  document.querySelectorAll('#p_list .prt').forEach((el,i)=>{const p=ui.we.parts[i];if(!p)return;
    p.name=el.querySelector('.p_name').value.trim();p.price=el.querySelector('.p_price').value.trim();p.link=el.querySelector('.p_link').value.trim();
    const iu=el.querySelector('.p_img').value.trim();if(iu){if(safeUrl(iu))p.img=safeUrl(iu)}else if(/^https?:/.test(p.img||''))p.img=''});
}
function updTotal(){const el=$('#p_total');if(!el)return;const sum=ui.we.parts.reduce((a,p)=>a+num(p.price),0);el.textContent=t('total')+' '+money(sum,2,$('#w_cur').value)}
function resizeImg(src,max){return new Promise((res,rej)=>{const im=new Image();if(!String(src).startsWith('data:'))im.crossOrigin='anonymous';
  const to=setTimeout(()=>rej(new Error('timeout')),15000);
  im.onload=()=>{clearTimeout(to);try{const k=Math.min(1,max/Math.max(im.width||1,im.height||1)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))}catch(e){rej(e)}};
  im.onerror=e=>{clearTimeout(to);rej(e)};im.src=src})}
function wSaveItem(){
  const e=ui.we,name=$('#w_name').value.trim();if(!name)return toast(t('errName'));
  if(e.type==='project'){readParts();e.parts=e.parts.filter(p=>p.name||num(p.price));if(!e.parts.some(p=>p.name))return toast(t('errParts'));e.parts.forEach(p=>{delete p._open;p.price=p.price!==''?num(p.price):''})}
  const w=wishes().find(x=>x.id===e.id)||{id:e.id,created:iso(today())};
  Object.assign(w,{type:e.type,name,price:e.type==='project'?'':($('#w_price').value.trim()?num($('#w_price').value):''),cur:$('#w_cur').value,cat:$('#w_cat').value,prio:e.prio||2,
    target:($('#w_target').value||'').slice(0,7),link:$('#w_link').value.trim(),img:safeImg(e.img),notes:$('#w_notes').value,parts:e.type==='project'?e.parts:[]});
  if(w.type==='project'&&w.bought&&!w.parts.every(p=>p.bought)){w.bought=false;delete w.boughtDate;delete w.boughtPrice}
  if(!wishes().includes(w))wishes().push(w);
  save();closeSheet();render();toast(t('tSaved'));
  // keep offline copies of picture links when the website allows it; otherwise the link is kept as it is
  const keep=(obj)=>{if(/^https?:/.test(obj.img||''))resizeImg(obj.img,700).then(d=>{obj.img=d;save();render()}).catch(()=>{})};
  keep(w);partsOf(w).forEach(keep);
}

/* =====================================================================
   INTRO ANIMATION
   ===================================================================== */
function greeting(){const h=new Date().getHours(),g=t(h>=5&&h<12?'gMorning':h>=12&&h<20?'gAfternoon':'gEvening');return state.userName?`${g}, ${state.userName}`:g}
function splash(force){
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,td=iso(today());
  const first=!state.onboarded&&!state.items.length;
  if(!first&&!force&&(rm||state.lastSplash===td)){$('#view').classList.add('fadein');return}
  if(!first){state.lastSplash=td;state.onboarded=true;save()}
  window.scrollTo(0,0);
  const el=document.createElement('div');el.className='spl';
  const bars='<div class="sp-ic"><i style="height:40px"></i><i style="height:58px;animation-delay:.24s"></i><i style="height:31px;animation-delay:.38s"></i></div>';
  if(first){
    const draw=()=>{el.innerHTML=bars+`<div class="sp-g">${t('welcome')}</div><div class="sp-ob"><div class="sp-s">${t('welcomeSub')}</div>
      <div class="sp-flags">${LANGS.map(l=>`<button type="button" data-sl="${l}" class="${l===state.lang?'on':''}">${flagImg(l)}<span>${T[l].langName}</span></button>`).join('')}</div>
      <input id="sp_name" placeholder="${t('yourName')}" autocomplete="given-name" value="${esc(state.userName||'')}">
      <select id="sp_cur">${COMMON_CUR.map(c=>`<option ${c===state.currency?'selected':''}>${c}</option>`).join('')}</select>
      <button type="button" class="sp-go" id="sp_go">${t('start')}</button></div>`};
    draw();document.body.appendChild(el);setTimeout(()=>el.classList.add('s2'),800);
    el.addEventListener('click',ev=>{
      const f=ev.target.closest('[data-sl]');
      if(f){state.userName=$('#sp_name').value.trim();state.lang=f.dataset.sl;draw();el.querySelectorAll('.sp-ic i').forEach(i=>i.style.animation='none');el.querySelectorAll('.sp-ic i').forEach(i=>i.style.transform='none');render();return}
      if(ev.target.closest('#sp_go')){state.userName=$('#sp_name').value.trim();state.currency=$('#sp_cur').value;state.onboarded=true;state.lastSplash=td;save();render();
        el.classList.add('out');setTimeout(()=>{el.style.opacity='0'},150);setTimeout(()=>el.remove(),550)}
    });
    return;
  }
  // this month, in the currency shown on the Overview
  const cur=ui.dcur||state.currency,tt=today(),items=state.items.filter(p=>curOf(p)===cur);
  const mS=new Date(tt.getFullYear(),tt.getMonth(),1),mE=new Date(tt.getFullYear(),tt.getMonth()+1,0);
  let due=0,paid=0;items.forEach(p=>events(p,mS,mE).forEach(e=>{due+=e.amt;if(e.d<=tt)paid+=e.amt}));
  const monthly=items.filter(p=>!stats(p).done).reduce((a,p)=>a+perMonth(p),0),frac=due?paid/due:0;
  const R=80,C=2*Math.PI*R;
  el.innerHTML=bars+`<div class="sp-g">${esc(greeting())}</div>
   <div class="sp-ring"><svg viewBox="0 0 180 180" width="180" height="180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/>
   <circle class="pg" cx="90" cy="90" r="${R}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 90 90)"/></svg>
   <div class="sp-num"><b id="sp_v">${money(0,2,cur)}</b><span>${t('perMonth')}</span></div></div>
   <div class="sp-sub">${due?t('monthPaid',{p:Math.round(frac*100),m:tt.toLocaleDateString(loc(),{month:'long'})}):''}</div>`;
  document.body.appendChild(el);
  let done=false;
  const finish=()=>{if(done)return;done=true;window.scrollTo(0,0);el.classList.add('out');const hero=$('.hero');
    if(hero){const r=hero.getBoundingClientRect(),W=innerWidth,H=innerHeight,cp=`inset(${r.top}px ${W-r.right}px ${H-r.bottom}px ${r.left}px round 22px)`;
      el.style.webkitClipPath=cp;el.style.clipPath=cp;setTimeout(()=>{el.style.opacity='0'},430);setTimeout(()=>el.remove(),800)}
    else{el.style.opacity='0';setTimeout(()=>el.remove(),400)}};
  el.addEventListener('click',finish);
  setTimeout(()=>{if(done)return;el.classList.add('s2');
    const pg=el.querySelector('.pg');requestAnimationFrame(()=>{pg.style.strokeDashoffset=String(C*(1-Math.max(frac,0.02)))});
    const v=$('#sp_v'),t0=performance.now(),D=950;
    const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);v.textContent=money(monthly*e,2,cur);if(k<1&&!done)requestAnimationFrame(step)};requestAnimationFrame(step);
  },750);
  setTimeout(finish,2350);
}

load();render();splash();
</script>
